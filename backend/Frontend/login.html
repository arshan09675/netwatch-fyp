<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch | Secure Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background: linear-gradient(135deg, #050814 0%, #0a0e27 50%, #11162a 100%);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container{
            background: rgba(17,22,42,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .logo{text-align:center;font-size:3rem;margin-bottom:1rem;}
        h1{text-align:center;background:linear-gradient(135deg,#00d4ff,#6c63ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:1.5rem;}
        .input-group{margin-bottom:1rem;}
        input{
            width:100%;padding:0.9rem 1rem;
            background:rgba(5,8,20,0.8);border:1px solid rgba(255,255,255,0.1);
            border-radius:16px;color:white;font-size:1rem;
        }
        input:focus{outline:none;border-color:#00d4ff;}
        button{
            width:100%;padding:0.9rem;
            background:linear-gradient(135deg,#00d4ff,#6c63ff);
            border:none;border-radius:16px;color:white;font-size:1rem;
            font-weight:600;cursor:pointer;margin-top:0.5rem;
        }
        button:hover{transform:translateY(-2px);}
        .checkbox-group{display:flex;align-items:center;gap:0.5rem;margin-top:1rem;}
        .forgot-password{text-align:right;margin-top:0.5rem;}
        .forgot-password a{color:#7f8cbf;font-size:0.8rem;cursor:pointer;}
        .switch{text-align:center;margin-top:1rem;color:#7f8cbf;}
        .switch a{color:#00d4ff;cursor:pointer;}
        .error{color:#ef4444;font-size:0.8rem;margin-top:0.5rem;text-align:center;}
        .success{color:#2ecc87;font-size:0.8rem;margin-top:0.5rem;text-align:center;}
        hr{border-color:rgba(255,255,255,0.1);margin:1rem 0;}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🌐</div>
        <h1>NetWatch Login</h1>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Username or Email">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="remember-me">
            <label style="color:#7f8cbf;">Remember me</label>
        </div>
        
        <div class="forgot-password">
            <a onclick="alert('Contact admin to reset password')">Forgot password?</a>
        </div>
        
        <button onclick="login()">Login</button>
        
        <div id="message" class="error"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            const messageDiv = document.getElementById('message');
            
            if (!username || !password) {
                messageDiv.innerHTML = 'Please enter username and password';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username_or_email: username,
                        password: password,
                        remember_me: rememberMe
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    messageDiv.className = 'success';
                    messageDiv.innerHTML = 'Login successful! Redirecting...';
                    setTimeout(() => {
                        window.location.href = '/Frontend/dashboard.html';
                    }, 1000);
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerHTML = data.error || data.message || 'Login failed';
                }
            } catch(error) {
                messageDiv.className = 'error';
                messageDiv.innerHTML = 'Server error. Make sure backend is running.';
                console.error('Login error:', error);
            }
        }
    </script>
</body>
</html>
