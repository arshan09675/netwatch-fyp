<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch | Alert Center</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .alert-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
        }
        .ack-btn {
            background: rgba(0, 212, 255, 0.2);
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 0.5rem;
            font-size: 0.7rem;
        }
        .alert-stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-badge {
            background: var(--card-bg);
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><div class="logo-icon">🌐</div>NetWatch</div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
            <a href="alerts.html" class="nav-link active">🔔 Alerts</a>
            <a href="map.html" class="nav-link">🗺️ Map</a>
        </div>
        <div class="ws-indicator" id="ws-indicator">🔄 Connecting...</div>
    </nav>
    
    <div class="main-container">
        <h1 style="margin-bottom: 1rem;">🔔 Alert Center</h1>
        
        <div class="alert-stats">
            <div class="stat-badge">🔴 Critical: <span id="critical-count">0</span></div>
            <div class="stat-badge">🟡 Warning: <span id="warning-count">0</span></div>
            <div class="stat-badge">🔵 Info: <span id="info-count">0</span></div>
        </div>
        
        <div class="alert-filters">
            <button class="filter-btn active" onclick="filterAlerts('all')">All</button>
            <button class="filter-btn" onclick="filterAlerts('critical')">Critical</button>
            <button class="filter-btn" onclick="filterAlerts('warning')">Warning</button>
            <button class="filter-btn" onclick="filterAlerts('info')">Info</button>
            <button class="filter-btn" onclick="filterAlerts('anomaly')">Anomaly</button>
            <button class="filter-btn" onclick="fetchAlerts(true)">Unacknowledged Only</button>
            <button class="filter-btn" onclick="fetchAlerts()">Refresh</button>
        </div>
        
        <div id="alerts-container"></div>
    </div>
    
    <script src="script.js"></script>
    <script>
        let currentFilter = 'all';
        let showUnacknowledged = false;
        
        async function fetchAlerts(unacknowledged = false) {
            showUnacknowledged = unacknowledged;
            let url = `${API_BASE}/api/alerts?limit=100`;
            if (showUnacknowledged) url += '&acknowledged=false';
            
            try {
                const response = await fetch(url);
                const alerts = await response.json();
                displayAlerts(alerts);
            } catch (error) {
                console.error('Error fetching alerts:', error);
            }
        }
        
        function displayAlerts(alerts) {
            let filtered = alerts;
            if (currentFilter !== 'all') {
                filtered = alerts.filter(a => a.severity === currentFilter || a.alert_type === currentFilter);
            }
            
            const counts = {
                critical: alerts.filter(a => a.severity === 'critical' || a.alert_type === 'critical').length,
                warning: alerts.filter(a => a.severity === 'warning' || a.alert_type === 'warning').length,
                info: alerts.filter(a => a.severity === 'info' || a.alert_type === 'info' || a.alert_type === 'anomaly').length
            };
            
            document.getElementById('critical-count').textContent = counts.critical;
            document.getElementById('warning-count').textContent = counts.warning;
            document.getElementById('info-count').textContent = counts.info;
            
            const container = document.getElementById('alerts-container');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-alerts">✅ No alerts found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(alert => `
                <div class="alert-item ${alert.severity || alert.alert_type}" data-id="${alert.id}">
                    <div class="alert-title">${alert.title || alert.alert_type.toUpperCase()}</div>
                    <div class="alert-message">${alert.message}</div>
                    <div class="alert-time">📅 ${new Date(alert.timestamp * 1000).toLocaleString()}</div>
                    ${alert.value ? `<div class="alert-value">📊 Value: ${alert.value} ${alert.threshold ? `/ Threshold: ${alert.threshold}` : ''}</div>` : ''}
                    ${!alert.acknowledged ? `<button class="ack-btn" onclick="acknowledgeAlert(${alert.id})">✓ Acknowledge</button>` : '<span class="ack-badge">✓ Acknowledged</span>'}
                </div>
            `).join('');
        }
        
        function filterAlerts(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            fetchAlerts(showUnacknowledged);
        }
        
        async function acknowledgeAlert(id) {
            await fetch(`${API_BASE}/api/alerts/${id}/acknowledge`, { method: 'POST' });
            fetchAlerts(showUnacknowledged);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchAlerts();
            setInterval(() => fetchAlerts(showUnacknowledged), 10000);
        });
    </script>
</body>
</html>
